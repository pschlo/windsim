<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 540" role="img" aria-labelledby="title description">
  <title id="title">Windsim noise simulation architecture</title>
  <desc id="description">Planner resolves asset dependencies and runs four stages in order: load configuration, turbine spectra, and FABDEM terrain; prepare coordinates, elevation, and receivers; calculate ISO 9613-2 acoustics with Xarray and Dask; and create sound-level, noise-map, and NetCDF outputs.</desc>

  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 12 6 0 12Z" fill="#465563"/>
    </marker>
    <style>
      .text { font-family: Arial, Helvetica, sans-serif; fill: #18212b; }
      .muted { fill: #52606d; }
      .card { fill: #ffffff; stroke: #c8d1da; stroke-width: 1.5; }
      .stage { font-size: 23px; font-weight: 700; }
      .item { font-size: 18px; font-weight: 700; }
      .detail { font-size: 16px; fill: #52606d; }
      .rule { stroke: #d8dee4; stroke-width: 1.2; }
      .icon { fill: none; stroke: #245b78; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
      .icon-fill { fill: #dcecf3; stroke: #245b78; stroke-width: 2; stroke-linejoin: round; }
    </style>
  </defs>

  <rect width="1280" height="540" fill="#f6f8fa"/>

  <text class="text" x="40" y="35" font-size="25" font-weight="700">Default noise workflow</text>

  <rect x="40" y="52" width="1185" height="72" rx="8" fill="#185b83"/>
  <g transform="translate(64 70)" fill="none" stroke="#ffffff" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="13" cy="18" r="9"/>
    <circle cx="45" cy="18" r="9"/>
    <circle cx="77" cy="18" r="9"/>
    <path d="M22 18H36M54 18H68"/>
    <path d="M13 9V3M45 27v6M77 9V3"/>
  </g>
  <text x="166" y="83" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#ffffff">Planner</text>
  <text x="166" y="108" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#ffffff">resolves asset dependencies and runs recipes in the required order</text>

  <path d="M314 319H340" fill="none" stroke="#465563" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M619 319H645" fill="none" stroke="#465563" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M924 319H950" fill="none" stroke="#465563" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Load data -->
  <g transform="translate(40 150)">
    <rect class="card" width="270" height="340" rx="8"/>
    <path d="M8 0H262A8 8 0 0 1 270 8V10H0V8A8 8 0 0 1 8 0Z" fill="#65558f"/>
    <circle cx="31" cy="49" r="17" fill="#eeeaf5" stroke="#65558f" stroke-width="1.5"/>
    <text class="text" x="31" y="55" font-size="17" font-weight="700" text-anchor="middle">1</text>
    <text class="text stage" x="59" y="57">Load data</text>
    <line class="rule" x1="22" y1="79" x2="248" y2="79"/>

    <g transform="translate(22 102)">
      <path class="icon" d="M3 1H18L25 8V30H3Z M18 1V8H25"/>
      <text class="text item" x="40" y="13">Configuration</text>
      <text class="text detail" x="40" y="35">config.toml · setup.toml</text>
    </g>
    <g transform="translate(22 175)">
      <path class="icon" d="M3 29V19M10 29V10M17 29V15M24 29V4M1 29H27"/>
      <text class="text item" x="40" y="13">Turbine spectra</text>
      <text class="text detail" x="40" y="35">octave-band sound power</text>
    </g>
    <g transform="translate(22 248)">
      <path class="icon-fill" d="M2 28 9 16l6 7 7-15 8 20Z"/>
      <path class="icon" d="M5 11c4-4 8-5 12-4M21 4c3 0 6 1 8 3"/>
      <text class="text item" x="40" y="13">FABDEM terrain</text>
      <text class="text detail" x="40" y="35">downloaded and cached</text>
    </g>
  </g>

  <!-- Prepare inputs -->
  <g transform="translate(345 150)">
    <rect class="card" width="270" height="340" rx="8"/>
    <path d="M8 0H262A8 8 0 0 1 270 8V10H0V8A8 8 0 0 1 8 0Z" fill="#2f7189"/>
    <circle cx="31" cy="49" r="17" fill="#e4f0f4" stroke="#2f7189" stroke-width="1.5"/>
    <text class="text" x="31" y="55" font-size="17" font-weight="700" text-anchor="middle">2</text>
    <text class="text stage" x="59" y="57">Prepare inputs</text>
    <line class="rule" x1="22" y1="79" x2="248" y2="79"/>

    <g transform="translate(22 102)">
      <circle class="icon" cx="15" cy="13" r="8"/>
      <path class="icon" d="M15 21V30M5 30H25M15 13l5-4M7 5l-4 4M23 21l4 4"/>
      <text class="text item" x="40" y="13">Project coordinates</text>
      <text class="text detail" x="40" y="35">determine a working CRS</text>
    </g>
    <g transform="translate(22 175)">
      <path class="icon-fill" d="M2 28 9 18l6 5 7-15 8 20Z"/>
      <path class="icon" d="M3 7H29M7 3 3 7l4 4M25 3l4 4-4 4"/>
      <text class="text item" x="40" y="13">Interpolate terrain</text>
      <text class="text detail" x="40" y="35">add source/receiver heights</text>
    </g>
    <g transform="translate(22 248)">
      <path class="icon" d="M2 6H29M2 16H29M2 26H29M7 1V31M17 1V31M27 1V31"/>
      <circle cx="7" cy="16" r="3.8" fill="#c74343" stroke="#ffffff" stroke-width="1"/>
      <circle cx="27" cy="6" r="3.8" fill="#c74343" stroke="#ffffff" stroke-width="1"/>
      <text class="text item" x="40" y="13">Build receivers</text>
      <text class="text detail" x="40" y="35">selected points or a grid</text>
    </g>
  </g>

  <!-- Calculate -->
  <g transform="translate(650 150)">
    <rect class="card" width="270" height="340" rx="8"/>
    <path d="M8 0H262A8 8 0 0 1 270 8V10H0V8A8 8 0 0 1 8 0Z" fill="#39856e"/>
    <circle cx="31" cy="49" r="17" fill="#e4f1ed" stroke="#39856e" stroke-width="1.5"/>
    <text class="text" x="31" y="55" font-size="17" font-weight="700" text-anchor="middle">3</text>
    <text class="text stage" x="59" y="57">Calculate</text>
    <line class="rule" x1="22" y1="79" x2="248" y2="79"/>

    <g transform="translate(22 98)">
      <path class="icon" d="M3 17h5M10 11c4 3 4 9 0 12M16 6c8 6 8 16 0 22M23 2c11 9 11 23 0 32"/>
      <text class="text item" x="40" y="13">Acoustic model</text>
      <text class="text detail" x="40" y="34">ISO 9613-2</text>
      <text class="text detail" x="40" y="54">optional Interimsverfahren</text>
    </g>
    <g transform="translate(22 181)">
      <polygon points="2,11 16,3 30,11 16,19" fill="#b9dce8" stroke="#245b78" stroke-width="2" stroke-linejoin="round"/>
      <polygon points="2,11 16,19 16,35 2,27" fill="#dcecf3" stroke="#245b78" stroke-width="2" stroke-linejoin="round"/>
      <polygon points="16,19 30,11 30,27 16,35" fill="#8fc3d4" stroke="#245b78" stroke-width="2" stroke-linejoin="round"/>
      <text class="text item" x="40" y="13">Xarray</text>
      <text class="text detail" x="40" y="34">turbine × receiver</text>
      <text class="text detail" x="40" y="54">× frequency</text>
    </g>
    <g transform="translate(22 264)">
      <rect x="2" y="2" width="12" height="12" rx="1.5" fill="#dcecf3" stroke="#245b78" stroke-width="1.8"/>
      <rect x="18" y="2" width="12" height="12" rx="1.5" fill="#b9dce8" stroke="#245b78" stroke-width="1.8"/>
      <rect x="2" y="18" width="12" height="12" rx="1.5" fill="#b9dce8" stroke="#245b78" stroke-width="1.8"/>
      <rect x="18" y="18" width="12" height="12" rx="1.5" fill="#8fc3d4" stroke="#245b78" stroke-width="1.8"/>
      <text class="text item" x="40" y="13">Dask</text>
      <text class="text detail" x="40" y="34">executes chunked tasks</text>
      <text class="text detail" x="40" y="54">on local workers</text>
    </g>
  </g>

  <!-- Create outputs -->
  <g transform="translate(955 150)">
    <rect class="card" width="270" height="340" rx="8"/>
    <path d="M8 0H262A8 8 0 0 1 270 8V10H0V8A8 8 0 0 1 8 0Z" fill="#aa7a18"/>
    <circle cx="31" cy="49" r="17" fill="#f6edd9" stroke="#aa7a18" stroke-width="1.5"/>
    <text class="text" x="31" y="55" font-size="17" font-weight="700" text-anchor="middle">4</text>
    <text class="text stage" x="59" y="57">Create outputs</text>
    <line class="rule" x1="22" y1="79" x2="248" y2="79"/>

    <g transform="translate(22 102)">
      <circle cx="8" cy="15" r="5" fill="#c74343" stroke="#8b2f2f" stroke-width="1.2"/>
      <path class="icon" d="M20 7H31M20 15H31M20 23H31"/>
      <text class="text item" x="40" y="13">Sound levels</text>
      <text class="text detail" x="40" y="35">point and grid results</text>
    </g>
    <g transform="translate(22 175)">
      <rect x="1" y="1" width="31" height="31" rx="2" fill="#eef4f6" stroke="#245b78" stroke-width="1.8"/>
      <path class="icon" d="M7 24c-4-7 1-15 8-15 8 0 13 8 9 14-4 6-13 6-17 1Z"/>
      <path class="icon" d="M11 21c-3-4 0-8 4-9 5 0 8 5 5 9-2 3-7 3-9 0Z"/>
      <circle cx="16" cy="18" r="2.5" fill="#c74343"/>
      <text class="text item" x="40" y="13">Noise maps</text>
      <text class="text detail" x="40" y="35">PNG contours</text>
    </g>
    <g transform="translate(22 248)">
      <ellipse cx="16" cy="6" rx="14" ry="5" fill="#dcecf3" stroke="#245b78" stroke-width="2"/>
      <path class="icon" d="M2 6V28c0 3 6 5 14 5s14-2 14-5V6M2 17c0 3 6 5 14 5s14-2 14-5"/>
      <text class="text item" x="40" y="13">Data export</text>
      <text class="text detail" x="40" y="35">NetCDF</text>
    </g>
  </g>

  <text class="text muted" x="640" y="520" font-size="16" text-anchor="middle">Recipes and data providers can be replaced or extended in custom workflows.</text>
</svg>
